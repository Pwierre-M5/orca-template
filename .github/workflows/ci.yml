name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Chaque script est ignoré s'il n'existe pas dans package.json (palier Léger).
      - name: Lint
        run: npm run lint --if-present
      - name: Typecheck
        run: npm run typecheck --if-present
      - name: Tests
        run: npm test --if-present
      - name: Build
        run: npm run build --if-present

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Format de branche
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH" == "chore/bootstrap-gouvernance" ]]; then exit 0; fi
          [[ "$BRANCH" =~ ^(feat|fix|refactor|docs|test|chore)/([a-z]+-[0-9]+|t[0-9]+)-[a-z0-9]+(-[a-z0-9]+)*$ ]] \
            || { echo "Branche non conforme : $BRANCH"; exit 1; }

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Compte d'organisation : ajouter GITLEAKS_LICENSE en secret.
